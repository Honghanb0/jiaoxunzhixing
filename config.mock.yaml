# 仅供本地验证多模型接入层使用：三家模型全部指向本地 mock 服务。
# 用法： ./sa_ai.exe -config config.mock.yaml  （监听 8081）
server:
  host: "127.0.0.1"
  port: 8081
  mode: "release"
  web_root: "./web"

database:
  neo4j:
    uri: "neo4j://127.0.0.1:7687"
    username: "neo4j"
    password: "@Cuz123456789"
    database: "neo4j"
    max_connection_pool_size: 50
    connection_acquisition_timeout: 30s
    max_transaction_retry_time: 5s
    max_retries: 5
    retry_backoff: 2s

# 三家模型全部指向本地 mock（http://127.0.0.1:8899）
# GLM 使用 id.secret 形态的 Key，用于验证 JWT 签发链路
ai:
  default: "kimi"
  strategy: "parallel"
  fallback: true
  fallback_order: ["kimi", "deepseek", "glm"]
  timeout: 20
  max_retries: 2
  retry_backoff_ms: 200
  providers:
    deepseek:
      enabled: true
      api_key: "sk-mock-deepseek"
      model: "mock-deepseek-v1"
      base_url: "http://127.0.0.1:8899"
      timeout: 20
    kimi:
      enabled: true
      api_key: "sk-mock-kimi"
      model: "mock-kimi-v1"
      base_url: "http://127.0.0.1:8899"
      timeout: 20
    glm:
      enabled: true
      api_key: "mockid.mocksecret"
      model: "mock-glm-v1"
      base_url: "http://127.0.0.1:8899"
      timeout: 20

scanner:
  concurrency: 5
  timeout: 10
  user_agent: "SecurityScanner/1.0 (+http://security-agent.local)"
  max_depth: 5
  max_pages: 1000
  respect_robots: true

scheduler:
  enabled: false
  max_concurrent_scans: 3

auth:
  jwt_secret: "${JWT_SECRET:-change-me-in-production}"
  token_expire_hours: 24

sensitive:
  keywords: ["password", "secret", "api_key", "token", "credential"]
  regex_patterns:
    - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
  file_extensions: [".sql", ".bak", ".env", ".git"]

alerts:
  enabled: false
  channels: []

logging:
  level: "info"
  format: "json"
  output: "stdout"
