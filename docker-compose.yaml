version: '3.8'

services:
  security-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - security-net

  neo4j:
    image: neo4j:5.14-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
      - NEO4J_PLUGINS=['apoc']
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_password", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - security-net

networks:
  security-net:
    driver: bridge

volumes:
  neo4j_data:
